<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock Bank 管理面板</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f4f6f8; color: #17212b; }
    body { margin: 0; }
    main { max-width: 960px; margin: auto; padding: 40px 20px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 28px; }
    p { color: #617080; }
    button { border: 0; border-radius: 8px; padding: 10px 16px; background: #1261a0; color: white; cursor: pointer; }
    #status { min-height: 24px; color: #b42318; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    article { background: white; border: 1px solid #dce2e8; border-radius: 12px; padding: 18px; box-shadow: 0 4px 14px #102a4310; }
    h2 { margin: 0 0 14px; font-size: 19px; }
    dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0; }
    dt { color: #617080; }
    dd { margin: 0; text-align: right; font-weight: 600; }
    .active { color: #067647; }
    .frozen { color: #b42318; }
  </style>
</head>
<body>
  <main>
    <header>
      <div><h1>Mock Bank</h1><p>本地用户与账户概览</p></div>
      <button id="refresh" type="button">刷新</button>
    </header>
    <div id="status"></div>
    <section id="users" class="grid" aria-live="polite"></section>
  </main>
  <script>
    let token = sessionStorage.getItem("bankApiToken") || "";

    function accountView(account) {
      const dl = document.createElement("dl");
      for (const [label, value, className] of [
        ["账户", account.id, ""], ["余额", `¥${account.balance}`, ""],
        ["状态", account.status, account.status]
      ]) {
        const dt = document.createElement("dt");
        const dd = document.createElement("dd");
        dt.textContent = label;
        dd.textContent = value;
        dd.className = className;
        dl.append(dt, dd);
      }
      return dl;
    }

    async function loadUsers() {
      const headers = token ? { Authorization: `Bearer ${token}` } : {};
      const response = await fetch("/users", { headers });
      if (response.status === 401) {
        token = prompt("请输入 Mock Bank API Token") || "";
        if (!token) throw new Error("需要 API Token 才能查看账户");
        sessionStorage.setItem("bankApiToken", token);
        return loadUsers();
      }
      if (!response.ok) throw new Error(`加载失败（HTTP ${response.status}）`);
      const users = await response.json();
      const container = document.querySelector("#users");
      container.replaceChildren();
      for (const user of users) {
        const card = document.createElement("article");
        const title = document.createElement("h2");
        title.textContent = `${user.name} · ${user.id}`;
        card.append(title, ...user.accounts.map(accountView));
        container.append(card);
      }
      document.querySelector("#status").textContent = "";
    }

    document.querySelector("#refresh").addEventListener("click", () => loadUsers().catch(showError));
    function showError(error) { document.querySelector("#status").textContent = error.message; }
    loadUsers().catch(showError);
  </script>
</body>
</html>
